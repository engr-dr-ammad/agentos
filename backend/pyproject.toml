[project]
name = "agentos-backend"
version = "0.1.0"
description = "AgentOS — AI workforce management platform (API + worker)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pydantic[email]>=2.7",
  "pydantic-settings>=2.3",
  "pyjwt>=2.8",
  "pwdlib[argon2]>=0.2",
  "cryptography>=42",
  "httpx>=0.27",
  "jinja2>=3.1.4",
  "jsonschema>=4.22",
  "croniter>=2.0",
  "pypdf>=4.2",
  "python-docx>=1.1",
  "pyotp>=2.9",
  "python-multipart>=0.0.9",
  "pgvector>=0.3",
  "stripe>=10",
  "aiosmtplib>=3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "S311", "B008", "E501"]
