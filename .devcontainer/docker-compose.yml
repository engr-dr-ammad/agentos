services:
  app:
    image: mcr.microsoft.com/devcontainers/python:1-3.12-bookworm
    volumes: [../..:/workspaces:cached]
    command: sleep infinity
    network_mode: service:db
    environment:
      AGENTOS_DATABASE_URL: postgresql+asyncpg://agentos_app:agentos_app@localhost:5432/agentos
      AGENTOS_MIGRATION_DATABASE_URL: postgresql+asyncpg://agentos:agentos@localhost:5432/agentos
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment: { POSTGRES_USER: agentos, POSTGRES_PASSWORD: agentos, POSTGRES_DB: agentos }
    volumes: [pgdata:/var/lib/postgresql/data, ./init-test-db.sql:/docker-entrypoint-initdb.d/init.sql:ro]
volumes:
  pgdata:
